<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Hacker Pro - Login</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#202020">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        /* Windows 11 Desktop Style Background Grid */
        body {
            background-color: #1c1c1c;
            background-image: 
                radial-gradient(at 0% 0%, rgba(32, 50, 90, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(20, 70, 50, 0.4) 0px, transparent 50%),
                linear-gradient(135deg, #0f1011 0%, #18191a 100%);
        }

        /* Windows 11 Acrylic/Mica Glass Effect */
        .windows-11-card {
            background: rgba(32, 32, 32, 0.65);
            backdrop-filter: blur(30px) saturate(130%);
            -webkit-backdrop-filter: blur(30px) saturate(130%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }

        /* Windows 11 Button Design */
        .win-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .win-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        .win-btn:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Continuous Loading Ring for Windows 11 look */
        .win-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #60cdff; /* Windows 11 Blue */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans text-white antialiased">

    <div class="w-full max-w-sm windows-11-card rounded-xl p-8 relative">
        
        <div class="text-center mb-8">
            <div class="w-12 h-12 mx-auto mb-4 bg-gradient-to-tr from-emerald-500 to-blue-500 rounded-lg shadow-inner opacity-90 flex items-center justify-center font-bold text-xl tracking-tighter">
                P
            </div>
            <h2 class="text-xl font-semibold tracking-wide text-white/90">Pak Hacker Pro</h2>
            <p class="text-xs text-white/40 mt-1">Sign in with your Google account</p>
        </div>

        <div id="login-view" class="space-y-4 block">
            <button onclick="loginWithGoogle()" class="win-btn w-full flex items-center justify-center gap-3 py-2.5 px-4 rounded-md font-medium text-sm cursor-pointer">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 5.48 1 0 6.48 0 13.24s5.48 12.24 12.24 12.24c7.05 0 11.75-4.945 11.75-11.945 0-.805-.085-1.42-.19-1.96h-11.56z"/>
                </svg>
                Sign in with Google
            </button>
            
            <div class="text-center">
                <span class="text-[11px] text-white/30">Secure auto-login across all devices</span>
            </div>
        </div>

        <div id="loading-view" class="hidden text-center py-6">
            <div class="win-spinner h-8 w-8 mx-auto mb-4"></div>
            <p class="text-xs text-white/60 tracking-wider font-normal">Please wait...</p>
        </div>

    </div>

    <script>
        // 1. AAPKA PROVIDED FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBsE6XjQZ7MdbvdPrAj6HR70g2Mi6Isx34",
            authDomain: "pakhackerpro.firebaseapp.com",
            databaseURL: "https://pakhackerpro-default-rtdb.firebaseio.com",
            projectId: "pakhackerpro",
            storageBucket: "pakhackerpro.firebasestorage.app",
            messagingSenderId: "17345648769",
            appId: "1:17345648769:web:f70f1bb04fae5626c69580"
        };
        
        // Initialize Firebase (Compat Version)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // Google Auth Provider Initialize
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // 2. AUTH STATE OBSERVER (Auto Redirect Logic)
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Agar user pehle se logged in hai to direct home.html par bhej do
                window.location.href = "home.html";
            } else {
                // Agar logged in nahi hai, to loading hatai aur login display karein
                showView('login-view');
            }
        });

        // 3. Google Login Function
        function loginWithGoogle() {
            showView('loading-view');

            // Direct Pop-up box khulega Google Account authentication ke liye
            auth.signInWithPopup(googleProvider)
                .then((result) => {
                    const user = result.user;
                    
                    // User ki details Realtime Database mein save/update hongi
                    database.ref('users/' + user.uid).set({
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        photo: user.photoURL,
                        lastLogin: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        // Data store hote hi direct home.html par bhej do
                        window.location.href = "home.html";
                    }).catch((dbErr) => {
                        console.error("Database Error:", dbErr);
                        // Agar DB rules block bhi karein tab bhi dashboard par bhej dega
                        window.location.href = "home.html";
                    });

                }).catch((error) => {
                    showView('login-view');
                    console.error("Login Failed:", error.message);
                    alert("Google Sign-In Failed: " + error.message);
                });
        }

        // View Switcher Function
        function showView(viewId) {
            if(viewId === 'loading-view') {
                document.getElementById('login-view').classList.replace('block', 'hidden');
                document.getElementById('loading-view').classList.replace('hidden', 'block');
            } else {
                document.getElementById('loading-view').classList.replace('block', 'hidden');
                document.getElementById('login-view').classList.replace('hidden', 'block');
            }
        }

        // PWA Service Worker Link
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Hacker Pro - Login</title>
    
    <!-- PWA Manifest Linking -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#202020">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        /* Windows 11 Desktop Style Background Grid */
        body {
            background-color: #1c1c1c;
            background-image: 
                radial-gradient(at 0% 0%, rgba(32, 50, 90, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(20, 70, 50, 0.4) 0px, transparent 50%),
                linear-gradient(135deg, #0f1011 0%, #18191a 100%);
        }

        /* Windows 11 Acrylic Glass Effect */
        .windows-11-card {
            background: rgba(32, 32, 32, 0.65);
            backdrop-filter: blur(30px) saturate(130%);
            -webkit-backdrop-filter: blur(30px) saturate(130%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }

        /* Windows 11 Buttons */
        .win-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .win-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .win-btn:active { transform: scale(0.98); }

        /* ADVANCED NEON BLINKING INSTALL BUTTON EFFECT */
        @keyframes ultra-glow {
            0% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.4), inset 0 0 5px rgba(16, 185, 129, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.8), inset 0 0 10px rgba(16, 185, 129, 0.4); transform: scale(1.02); }
            100% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.4), inset 0 0 5px rgba(16, 185, 129, 0.2); transform: scale(1); }
        }
        .pro-install-btn {
            animation: ultra-glow 2s infinite ease-in-out;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(59, 130, 246, 0.25) 100%);
            border: 1px solid rgba(16, 185, 129, 0.6);
            transition: all 0.3s ease;
        }
        .pro-install-btn:hover {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4) 0%, rgba(59, 130, 246, 0.4) 100%);
            border-color: #10b981;
        }

        /* PREMIUM NO INTERNET OVERLAY CARD ANIMATION */
        @keyframes pulse-warning {
            0%, 100% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 15px rgba(0,0,0,0.5); }
            50% { border-color: rgba(239, 68, 68, 0.8); box-shadow: 0 0 25px rgba(239, 68, 68, 0.2); }
        }
        .offline-card {
            animation: pulse-warning 2.5s infinite ease-in-out;
            background: rgba(25, 15, 15, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        /* Windows 11 Loading Spinner */
        .win-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #60cdff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans text-white antialiased relative">

    <!-- 1. PREMIUM NO INTERNET OVERLAY (Hidden by default) -->
    <div id="offline-overlay" class="hidden fixed inset-0 z-50 bg-[#0a0a0acc]/80 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="w-full max-w-sm offline-card rounded-xl p-8 text-center shadow-2xl">
            <!-- Animated Warning Sign -->
            <div class="w-16 h-16 mx-auto mb-4 bg-red-500/10 rounded-full flex items-center justify-center text-red-500 border border-red-500/30">
                <svg class="w-8 h-8 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-red-400 tracking-wide">NO INTERNET CONNECTION</h3>
            <p class="text-xs text-white/60 mt-2 leading-relaxed">Pak Hacker Pro requires an active connection for real-time authentication.</p>
            
            <div class="bg-white/5 border border-white/5 rounded-lg p-3 my-5 text-left">
                <span class="text-[11px] text-emerald-400 font-semibold block mb-0.5">✓ Running from Mobile Cache</span>
                <span class="text-[11px] text-white/40 block">Offline system data has been safely secured.</span>
            </div>

            <p class="text-xs text-yellow-500 font-medium animate-pulse">Please check your mobile data or Wi-Fi network...</p>
        </div>
    </div>


    <!-- 2. MAIN LOGIN CARD (Runs from cache even offline) -->
    <div id="main-app-card" class="w-full max-w-sm windows-11-card rounded-xl p-8 relative">
        
        <!-- HIGHLY PROFESSIONAL BLINKING INSTALL BUTTON -->
        <button id="custom-install-btn" class="hidden w-full pro-install-btn text-emerald-400 font-bold py-3 px-4 rounded-lg mb-6 text-xs flex items-center justify-center gap-2.5 tracking-wider uppercase cursor-pointer shadow-md">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#10b981] animate-ping"></span>
            Install Official Application
        </button>

        <!-- TOP LOGO / BRANDING -->
        <div class="text-center mb-6">
            <img src="icon/icon-512x512.png" alt="Pak Hacker Pro Logo" class="w-16 h-16 mx-auto mb-4 rounded-xl shadow-lg object-contain border border-white/10">
            <h2 class="text-xl font-semibold tracking-wide text-white/90">Pak Hacker Pro</h2>
            <p class="text-xs text-white/40 mt-1">Sign in with your Google account</p>
        </div>

        <!-- LOGIN VIEW -->
        <div id="login-view" class="space-y-4 block">
            <button onclick="loginWithGoogle()" class="win-btn w-full flex items-center justify-center gap-3 py-2.5 px-4 rounded-md font-medium text-sm cursor-pointer">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 5.48 1 0 6.48 0 13.24s5.48 12.24 12.24 12.24c7.05 0 11.75-4.945 11.75-11.945 0-.805-.085-1.42-.19-1.96h-11.56z"/>
                </svg>
                Sign in with Google
            </button>
            
            <div class="relative py-1">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
                <div class="relative flex justify-center text-[10px] uppercase text-white/20"><span>or</span></div>
            </div>

            <!-- Manual Email/Password For Premium Users -->
            <div class="space-y-2">
                <input type="email" id="email" placeholder="Email Address" class="w-full bg-white/5 border border-white/10 rounded p-2 text-sm text-white outline-none focus:border-emerald-500 transition-colors">
                <input type="password" id="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded p-2 text-sm text-white outline-none focus:border-emerald-500 transition-colors">
                <button onclick="loginWithEmail()" class="win-btn w-full py-2.5 rounded font-medium text-sm text-emerald-400 cursor-pointer">
                    Login (Only Premium User)
                </button>
            </div>
        </div>

        <!-- LOADING VIEW -->
        <div id="loading-view" class="hidden text-center py-6">
            <div class="win-spinner h-8 w-8 mx-auto mb-4"></div>
            <p class="text-xs text-white/60 tracking-wider font-normal">Please wait...</p>
        </div>

    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBsE6XjQZ7MdbvdPrAj6HR70g2Mi6Isx34",
            authDomain: "pakhackerpro.firebaseapp.com",
            databaseURL: "https://pakhackerpro-default-rtdb.firebaseio.com",
            projectId: "pakhackerpro",
            storageBucket: "pakhackerpro.firebasestorage.app",
            messagingSenderId: "17345648769",
            appId: "1:17345648769:web:f70f1bb04fae5626c69580"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        auth.onAuthStateChanged((user) => {
            if (user && navigator.onLine) { window.location.href = "home.html"; } 
            else { showView('login-view'); }
        });

        function loginWithGoogle() {
            if(!navigator.onLine) { return; } 
            showView('loading-view');
            auth.signInWithPopup(googleProvider).then((result) => {
                const user = result.user;
                database.ref('users/' + user.uid).set({
                    uid: user.uid, name: user.displayName, email: user.email, photo: user.photoURL, lastLogin: firebase.database.ServerValue.TIMESTAMP
                }).then(() => { window.location.href = "home.html"; }).catch(() => { window.location.href = "home.html"; });
            }).catch((error) => { showView('login-view'); alert("Google Sign-In Failed: " + error.message); });
        }

        function loginWithEmail() {
            if(!navigator.onLine) { return; }
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) { alert("Please enter credentials."); return; }
            showView('loading-view');
            auth.signInWithEmailAndPassword(email, password).then((userCredential) => {
                database.ref('premium_users/' + userCredential.user.uid).once('value').then((snapshot) => {
                    if (snapshot.exists()) { window.location.href = "home.html"; } 
                    else { auth.signOut(); alert("Access Denied: Not a Premium User."); showView('login-view'); }
                }).catch(() => { auth.signOut(); showView('login-view'); });
            }).catch((error) => { showView('login-view'); alert("Authentication Failed: " + error.message); });
        }

        function showView(viewId) {
            if(viewId === 'loading-view') {
                document.getElementById('login-view').classList.replace('block', 'hidden');
                document.getElementById('loading-view').classList.replace('hidden', 'block');
            } else {
                document.getElementById('loading-view').classList.replace('block', 'hidden');
                document.getElementById('login-view').classList.replace('hidden', 'block');
            }
        }

        // ================= DETECT NETWORK STATUS (ONLINE/OFFLINE) =================
        function updateNetworkStatus() {
            const offlineOverlay = document.getElementById('offline-overlay');
            if (navigator.onLine) {
                offlineOverlay.classList.replace('flex', 'hidden'); 
            } else {
                offlineOverlay.classList.replace('hidden', 'flex'); 
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus(); 

        // ================= ADVANCED PWA INSTALLATION INTERACTION =================
        let deferredPrompt;
        const installBtn = document.getElementById('custom-install-btn');

        if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
            installBtn.classList.add('hidden');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!window.matchMedia('(display-mode: standalone)').matches) {
                installBtn.classList.remove('hidden'); 
            }
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') { installBtn.classList.add('hidden'); }
                deferredPrompt = null;
            } else {
                alert("Application is setting up or already installed on this device.");
            }
        });

        // SERVICE WORKER & LIVE CACHE VERSION SYNC CONTROL
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log("New version found! Flushing memory cache...");
                                window.location.reload(); 
                            }
                        });
                    });
                }).catch(err => console.log("SW Sync Failed:", err));
            });
        }
    </script>
</body>
</html>

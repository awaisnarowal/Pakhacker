<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAK HACKER PRO | NarowaliyaModz</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#34d399">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Montserrat:wght@800&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-accent: #34d399;
            --bg-dark: #0f1115;
            --surface: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1a2e26, #0f1115); 
            color: #e2e8f0; min-height: 100vh; overflow: hidden;
        }

        /* Floating Menu Button - Always on Top */
        #menuToggle {
            position: fixed; top: 20px; left: 20px; width: 50px; height: 50px;
            background: var(--surface); border: 1px solid var(--card-border);
            border-radius: 15px; cursor: pointer; backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center; z-index: 10000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        #menuToggle span { width: 20px; height: 2px; background: var(--primary-accent); position: relative; }
        #menuToggle span::before, #menuToggle span::after {
            content: ''; position: absolute; width: 100%; height: 2px; background: var(--primary-accent); left: 0;
        }
        #menuToggle span::before { top: -6px; }
        #menuToggle span::after { bottom: -6px; }

        /* Sidebar Navigation */
        #sideMenu {
            position: fixed; top: 0; left: -280px; width: 260px; height: 100%;
            background: rgba(15, 17, 21, 0.98); backdrop-filter: blur(25px);
            border-right: 1px solid var(--card-border); z-index: 9999;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding-top: 90px;
        }
        #sideMenu.active { left: 0; }
        
        .menu-links a {
            display: flex; align-items: center; padding: 18px 25px; color: #cbd5e1; 
            text-decoration: none; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer; transition: 0.3s;
        }
        .menu-links a:hover { background: rgba(52, 211, 153, 0.1); color: var(--primary-accent); }

        /* Content Layout */
        .main-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100vh; padding-top: 80px; box-sizing: border-box; }

        .container {
            text-align: center; background: var(--surface); padding: 30px 20px; 
            border-radius: 32px; backdrop-filter: blur(24px); border: 1px solid var(--card-border); 
            width: 90%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 { font-family: 'Montserrat', sans-serif; color: var(--primary-accent); font-size: 1.6rem; margin: 0; }
        .sub-text { font-size: 0.65rem; color: var(--primary-accent); font-weight: 600; text-transform: uppercase; margin-bottom: 15px; display: block; }

        input {
            width: 85%; padding: 15px; background: rgba(0, 0, 0, 0.4); border: 1.5px solid var(--card-border);
            color: var(--primary-accent); border-radius: 20px; text-align: center; font-size: 1.4rem; outline: none;
        }

        .server-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 15px; }
        .btn {
            padding: 14px; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; 
            background: rgba(255, 255, 255, 0.05); color: var(--primary-accent);
            border: 1px solid rgba(52, 211, 153, 0.15); transition: 0.3s; font-size: 0.75rem;
        }
        .btn.active { background: var(--primary-accent) !important; color: #064e3b !important; }

        /* Persistent Frame Area */
        #result-box {
            width: 100%; flex-grow: 1; display: none; background: #000; border-top: 1px solid var(--card-border);
        }
        iframe { width: 100%; height: 100%; border: none; background: white; }

        .spinner { display: none; width: 30px; height: 30px; border: 3px solid rgba(52, 211, 153, 0.1); border-left-color: var(--primary-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 15px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="menuToggle" onclick="toggleMenu()"><span></span></div>

    <aside id="sideMenu">
        <nav class="menu-links">
            <a onclick="loadHome()">📱 Sim Database</a>
            <a onclick="loadExternal('https://cnic.sims.pk/')">🔍 Check Sims</a>
            <a onclick="loadExternal('bill_chk.html')">🧾 Check Bill</a>
            <a href="https://wa.me/923066474260" target="_blank">👨‍💻 Contact Dev</a>
            <a onclick="toggleMenu()" style="color: #ff7171; margin-top: 20px;">❌ Close Menu</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <div id="main-content" class="container">
            <h1>PAK HACKER PRO</h1>
            <span class="sub-text">v16.0 | NarowaliyaModz</span>
            
            <input type="tel" id="target" placeholder="03XXXXXXXXX" inputmode="numeric" oninput="checkLimit(this)">
            
            <div class="server-btns">
                <button class="btn" id="srv1" onclick="startSearch(1)">SERVER 1</button>
                <button class="btn" id="srv2" onclick="startSearch(2)">SERVER 2</button>
                <button class="btn" id="srv3" onclick="startSearch(3)">SERVER 3</button>
                <button class="btn" id="srv4" onclick="startSearch(4)">SERVER 4</button>
            </div>
        </div>

        <div id="loader" class="spinner"></div>
        <div id="result-box"><iframe id="content-frame"></iframe></div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }

        function loadHome() {
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('result-box').style.display = 'none';
            toggleMenu();
        }

        function loadExternal(url) {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            const frame = document.getElementById('content-frame');
            frame.src = url;
            frame.style.filter = "none";
            frame.onload = () => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('result-box').style.display = 'block';
            };
            toggleMenu();
        }

        function checkLimit(input) {
            let limit = (input.value.startsWith('0')) ? 11 : 13;
            if (input.value.length >= limit) { input.value = input.value.substring(0, limit); input.blur(); }
        }

        function startSearch(sid) {
            const num = document.getElementById('target').value.trim();
            if (num.length < 10) return alert("Valid number enter karein!");
            
            document.getElementById('loader').style.display = "block";
            let api = ["https://elookup.xyz/rana/lookup.php?num=", "https://teeveeltd.site/api.php?number=", "https://app.findpakjobs.pk/api.php?number=", "https://omrsite.com/api.php?number="][sid-1];

            const frame = document.getElementById('content-frame');
            frame.src = api + num;
            frame.style.filter = "invert(0.9) hue-rotate(160deg)";
            frame.onload = () => {
                document.getElementById('loader').style.display = "none";
                document.getElementById('result-box').style.display = "block";
                document.getElementById('main-content').style.display = 'none';
            };
        }
    </script>
</body>
</html>

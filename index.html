<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAK HACKER PRO | NarowaliyaModz</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#34d399">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Montserrat:wght@800&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-accent: #34d399;
            --bg-dark: #0f1115;
            --surface: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1a2e26, #0f1115); 
            color: #e2e8f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .container {
            text-align: center; background: var(--surface); padding: 40px 20px; 
            border-radius: 32px; backdrop-filter: blur(24px); border: 1px solid var(--card-border); 
            width: 90%; max-width: 480px; margin-top: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }

        h1 { font-family: 'Montserrat', sans-serif; color: var(--primary-accent); font-size: 1.8rem; letter-spacing: -1px; margin-bottom: 5px; }
        .brand-title { position: relative; display: inline-block; }
        .sub-text { font-size: 0.65rem; position: absolute; top: -10px; right: -45px; font-weight: 500; color: var(--primary-accent); text-transform: uppercase; }

        /* Urdu Disclaimer */
        .disclaimer-box {
            font-family: 'Noto Sans Arabic', sans-serif; direction: rtl; font-size: 0.85rem; 
            border-radius: 18px; padding: 15px; margin-bottom: 25px;
            background: rgba(255, 77, 77, 0.08); color: #ff9999; border: 1px solid rgba(255, 77, 77, 0.2); line-height: 1.6;
        }

        input {
            width: 85%; padding: 18px; background: rgba(0, 0, 0, 0.4); border: 1.5px solid var(--card-border);
            color: var(--primary-accent); border-radius: 22px; text-align: center; margin-bottom: 8px; outline: none; font-size: 1.6rem;
        }

        .server-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        
        .btn {
            padding: 16px; border: none; border-radius: 20px; font-weight: 700; cursor: pointer; 
            background: rgba(255, 255, 255, 0.05); color: var(--primary-accent);
            border: 1px solid rgba(52, 211, 153, 0.15); transition: 0.3s; font-size: 0.8rem;
        }

        .btn.active { background: var(--primary-accent) !important; color: #064e3b !important; }

        /* Install Button - Default Hidden */
        #install-btn {
            display: none; background: #fbbf24; color: #000; border: none; margin-top: 20px; width: 100%;
        }

        /* Responsive Iframe */
        #result-box { margin-top: 25px; display: none; width: 100%; border-radius: 28px; border: 1.5px solid rgba(52, 211, 153, 0.3); overflow: hidden; background: #0f1115; }
        iframe { width: 100%; height: 480px; border: none; filter: invert(0.92) hue-rotate(150deg) brightness(1.1) contrast(1.1); }
        .spinner { display: none; width: 40px; height: 40px; border: 4px solid rgba(52, 211, 153, 0.1); border-left-color: var(--primary-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 25px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* APK/Standalone mode mein button ko sakhti se hide karne ke liye */
        @media (display-mode: standalone) {
            #install-btn { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="container" data-aos="fade-up">
        <h1>PAK HACKER <span class="brand-title">PRO<span class="sub-text">NarowaliyaModz</span></span></h1>    
        
        <div class="disclaimer-box">
            <span style="font-weight:bold; display:block;">ضروری انتباہ</span>
            اس ٹول کا غلط استعمال غیر قانونی ہے۔ کسی بھی غلط سرگرمی کی صورت میں صارف خود ذمہ دار ہوگا۔
        </div>

        <div id="main-ui">
            <input type="tel" id="target" placeholder="03XXXXXXXXX" inputmode="numeric" oninput="checkLimit(this)">
            <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 20px;" id="limit-info">Ready</div>

            <div class="server-btns">
                <button class="btn" id="srv1" onclick="startSearch(1)">SERVER 1</button>
                <button class="btn" id="srv2" onclick="startSearch(2)">SERVER 2</button>
                <button class="btn" id="srv3" onclick="startSearch(3)">SERVER 3</button>
                <button class="btn" id="srv4" onclick="startSearch(4)">SERVER 4</button>
            </div>

            <button id="install-btn" class="btn">INSTALL APP (CHROME)</button>
        </div>

        <div id="loader" class="spinner"></div>
        <div id="result-box"><iframe id="frame" id="frame"></iframe></div>
    </div>

    <script>
        // 1. Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // 2. Install Button Logic (Only for Browser)
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Check agar app already installed nahi hai
            if (window.matchMedia('(display-mode: standalone)').matches) {
                return; 
            }
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // 3. Search Logic
        function checkLimit(input) {
            let val = input.value;
            let limit = (val.startsWith('0')) ? 11 : 13;
            document.getElementById('limit-info').innerText = "Length: " + val.length + " / " + limit;
            if (val.length >= limit) { input.value = val.substring(0, limit); input.blur(); }
        }

        function startSearch(sid) {
            const num = document.getElementById('target').value.trim();
            if (num.length < 10) { alert("Number correct enter karein!"); return; }

            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('srv' + sid).classList.add('active');

            document.getElementById('loader').style.display = "block";
            document.getElementById('result-box').style.display = "none";
            
            let api = "";
            switch(sid) {
                case 1: api = "https://elookup.xyz/rana/lookup.php?num="; break;
                case 2: api = "https://teeveeltd.site/api.php?number="; break;
                case 3: api = "https://app.findpakjobs.pk/api.php?number="; break;
                case 4: api = "https://omrsite.com/api2.php?password=3518&number="; break;
            }

            document.getElementById('frame').src = api + num;
            document.getElementById('frame').onload = () => {
                document.getElementById('loader').style.display = "none";
                document.getElementById('result-box').style.display = "block";
            };
        }
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 1000, once: true });</script>
</body>
</html>

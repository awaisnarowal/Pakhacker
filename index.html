<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAK HACKER PRO | Smart Logic</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#34d399">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Montserrat:wght@800&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-accent: #34d399;
            --bg-dark: #0f1115;
            --surface: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --error-red: #ff4d4d;
        }

        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1a2e26, #0f1115); 
            color: #e2e8f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .container {
            text-align: center; background: var(--surface); padding: 40px 20px; 
            border-radius: 32px; backdrop-filter: blur(24px); border: 1px solid var(--card-border); 
            width: 90%; max-width: 480px; margin-top: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }

        h1 { font-family: 'Montserrat', sans-serif; color: var(--primary-accent); font-size: 1.8rem; letter-spacing: -1px; margin-bottom: 5px; }
        
        .brand-title { position: relative; display: inline-block; }
        .sub-text {
            font-size: 0.65rem; position: absolute; top: -10px; right: -45px; 
            font-weight: 500; color: var(--primary-accent); text-transform: uppercase; opacity: 0.9;
        }

        /* Internet Error Box */
        #offline-box {
            display: none; background: rgba(255, 77, 77, 0.2); color: #fca5a5;
            border: 1px solid #ef4444; border-radius: 18px; padding: 15px; margin-bottom: 20px;
            font-weight: 600; animation: blink 1.5s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Urdu Disclaimer Box */
        .disclaimer-box {
            font-family: 'Noto Sans Arabic', sans-serif;
            direction: rtl; font-size: 0.9rem; border-radius: 18px; padding: 15px; margin-bottom: 25px;
            background: rgba(255, 77, 77, 0.08); color: #ff9999;
            border: 1px solid rgba(255, 77, 77, 0.2); line-height: 1.8; text-align: center;
        }
        .disclaimer-title { font-weight: 800; display: block; margin-bottom: 5px; text-decoration: underline; }

        input {
            width: 85%; padding: 18px; background: rgba(0, 0, 0, 0.4); border: 1.5px solid var(--card-border);
            color: var(--primary-accent); border-radius: 22px; text-align: center; margin-bottom: 8px; outline: none; 
            font-size: 1.6rem; font-weight: 500;
        }

        .server-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        
        .btn {
            padding: 16px; border: none; border-radius: 20px; font-weight: 700; cursor: pointer; 
            background: rgba(255, 255, 255, 0.05); color: var(--primary-accent);
            border: 1px solid rgba(52, 211, 153, 0.15); transition: all 0.3s; font-size: 0.8rem;
        }

        .btn.active {
            background: var(--primary-accent) !important; color: #064e3b !important;
            box-shadow: 0 5px 20px rgba(52, 211, 153, 0.4);
        }

        #result-box {
            margin-top: 25px; display: none; width: 100%; border-radius: 28px;
            border: 1.5px solid rgba(52, 211, 153, 0.3); overflow: hidden; background: #0f1115;
        }

        iframe { 
            width: 100%; height: 480px; border: none;
            filter: invert(0.92) hue-rotate(150deg) brightness(1.1) contrast(1.1);
        }
        
        .spinner { display: none; width: 40px; height: 40px; border: 4px solid rgba(52, 211, 153, 0.1); border-left-color: var(--primary-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 25px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container" data-aos="fade-up">
        <h1>
            PAK HACKER <span class="brand-title">PRO<span class="sub-text">NarowaliyaModz</span></span>
        </h1>    
        
        <div id="offline-box">⚠️ انٹرنیٹ بند ہے۔ براہ کرم کنکشن چیک کریں۔</div>

        <div class="disclaimer-box" id="warning-box">
            <span class="disclaimer-title">ضروری انتباہ</span>
            اس ٹول کا غلط استعمال غیر قانونی ہے۔ کسی بھی قسم کی غیر قانونی سرگرمی کی صورت میں <b style="color:white;">صارف خود ذمہ دار ہوگا</b>۔ انتظامیہ کسی بھی قسم کے نقصان کی ذمہ دار نہیں ہوگی۔
        </div>

        <div id="main-ui">
            <input type="tel" id="target" placeholder="03XXXXXXXXX" inputmode="numeric" oninput="checkLimit(this)">
            <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 25px;" id="limit-info">Status: Ready</div>

            <div class="server-btns">
                <button class="btn" id="srv1" onclick="startSearch(1)">SERVER 1</button>
                <button class="btn" id="srv2" onclick="startSearch(2)">SERVER 2</button>
                <button class="btn" id="srv3" onclick="startSearch(3)">SERVER 3</button>
                <button class="btn" id="srv4" onclick="startSearch(4)">SERVER 4</button>
            </div>
        </div>

        <div id="loader" class="spinner"></div>
        <div id="result-box"><iframe id="frame"></iframe></div>
    </div>

    <script>
        // Check Internet Connection
        function updateConnectionStatus() {
            const offlineBox = document.getElementById('offline-box');
            const mainUi = document.getElementById('main-ui');
            if (navigator.onLine) {
                offlineBox.style.display = 'none';
                mainUi.style.opacity = '1';
                mainUi.style.pointerEvents = 'auto';
            } else {
                offlineBox.style.display = 'block';
                mainUi.style.opacity = '0.3';
                mainUi.style.pointerEvents = 'none';
            }
        }
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        window.onload = updateConnectionStatus;

        function checkLimit(input) {
            let val = input.value;
            let limit = (val.startsWith('0')) ? 11 : 13;
            document.getElementById('limit-info').innerText = "Length: " + val.length + " / " + limit;
            if (val.length >= limit) { input.value = val.substring(0, limit); input.blur(); }
        }

        function startSearch(sid) {
            if (!navigator.onLine) return;
            const num = document.getElementById('target').value.trim();
            if (num.length < 10) { alert("نمبر درست درج کریں!"); return; }

            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('srv' + sid).classList.add('active');

            document.getElementById('loader').style.display = "block";
            document.getElementById('result-box').style.display = "none";
            
            let api = "";
            switch(sid) {
                case 1: api = "https://elookup.xyz/rana/lookup.php?num="; break;
                case 2: api = "https://teeveeltd.site/api.php?number="; break;
                case 3: api = "https://app.findpakjobs.pk/api.php?number="; break;
                case 4: api = "https://omrsite.com/api.php?number="; break;
            }

            document.getElementById('frame').src = api + num;
            document.getElementById('frame').onload = () => {
                document.getElementById('loader').style.display = "none";
                document.getElementById('result-box').style.display = "block";
            };
        }
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 1000, once: true });</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GEPCO Bill Checker | PAK HACKER PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* --- Sidebar & Navigation Styles (As per screenshot) --- */
        :root {
            --primary-accent: #34d399;
            --bg-dark: #0f1115;
            --surface: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: none; z-index: 998; opacity: 0; transition: 0.4s;
        }

        #menuToggle {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
            color: var(--primary-accent); padding: 12px 15px; border-radius: 12px;
            cursor: pointer; font-size: 1.3rem;
        }

        #menu {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: #0f1115; border-right: 1px solid var(--card-border); z-index: 999;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            padding: 100px 20px 20px; box-sizing: border-box; display: flex; flex-direction: column;
        }

        #menu.active { left: 0; }

        .menu-links { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; }
        
        .menu-links a {
            color: #e2e8f0; text-decoration: none; font-size: 1rem; font-weight: 500;
            padding: 18px 20px; border-radius: 20px; transition: 0.3s;
            display: flex; align-items: center; gap: 15px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid transparent;
        }

        .menu-links a:hover { 
            background: rgba(52, 211, 153, 0.1); 
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }

        .close-btn {
            background: rgba(255, 77, 77, 0.05) !important;
            color: #ff4d4d !important; border: 1px solid rgba(255, 77, 77, 0.1) !important;
            justify-content: center; font-weight: 700; margin-top: auto;
            padding: 18px !important; border-radius: 20px;
        }

        /* --- Bill Page Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(145deg, #e0eaf4 0%, #cfdef3 100%); min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 1300px; margin: 0 auto; margin-top: 60px; }
        .header-card { background: linear-gradient(135deg, #0b3b2f 0%, #1b5e3f 100%); border-radius: 40px; padding: 20px 30px; margin-bottom: 30px; box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.3); color: white; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .title-section h1 { font-size: 1.9rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }
        .title-section h1 i { background: #ffc107; padding: 10px; border-radius: 50%; color: #0b3b2f; }
        .search-panel { background: white; border-radius: 32px; padding: 20px 28px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08); margin-bottom: 32px; }
        .input-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .input-field { flex: 4; min-width: 240px; }
        .input-field input { width: 100%; padding: 16px 20px; font-size: 1rem; border: 2px solid #e2e8f0; border-radius: 28px; outline: none; transition: 0.3s; }
        .input-field input:focus { border-color: #1b5e3f; box-shadow: 0 0 0 4px rgba(27, 94, 63, 0.1); }
        .btn-check { flex: 1; min-width: 150px; background: #0b3b2f; border: none; padding: 16px 20px; border-radius: 40px; font-weight: bold; color: white; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-check:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .bill-card { background: white; border-radius: 36px; overflow: hidden; box-shadow: 0 20px 35px rgba(0,0,0,0.1); margin-top: 20px; }
        .bill-header { background: #1e3a2f; padding: 18px 28px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .bill-body { padding: 24px 28px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .info-item { background: #f8fafc; border-radius: 24px; padding: 15px 20px; border: 1px solid #e9edf2; }
        .info-label { font-size: 0.75rem; font-weight: 800; color: #4b6a8b; text-transform: uppercase; }
        .info-value { font-size: 1.2rem; font-weight: 700; color: #0f2c3d; margin-top: 5px; }
        .red-code-badge { background: #dc2626; color: white; padding: 15px; border-radius: 20px; text-align: center; margin-top: 25px; font-weight: bold; border: 1px solid #ff6b6b; line-height: 1.6; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>
<button id="menuToggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>

<aside id="menu">
    <nav class="menu-links">
        <a href="index.html"><i class="fas fa-folder"></i> Sim Database</a>
        <a href="https://cnic.sims.pk/" target="_blank"><i class="fas fa-search"></i> Check Sim</a>
        <a href="bill_chk.html" style="background:rgba(52, 211, 153, 0.1); color:var(--primary-accent); border-color:var(--primary-accent);"><i class="fas fa-bolt"></i> Electric Bill CHK</a>
        <a href="https://wa.me/923000000000" target="_blank"><i class="fas fa-phone-alt"></i> Contact Dev</a>
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()"><i class="fas fa-times"></i> CLOSE MENU</a>
    </nav>
</aside>

<div class="container">
    <div class="header-card">
        <div class="title-section">
            <h1><i class="fas fa-bolt"></i> GEPCO Bill</h1>
            <p>Check your electricity bill instantly</p>
        </div>
        <div class="badge">Official Data Source</div>
    </div>

    <div class="search-panel">
        <div class="input-group">
            <div class="input-field">
                <label style="font-weight:700; color:#1e4663; display:block; margin-bottom:10px; font-size:0.8rem;">REFERENCE NUMBER</label>
                <input type="tel" id="refInput" placeholder="Enter 14-digit reference number">
            </div>
            <button class="btn-check" id="fetchBtn"><i class="fas fa-search"></i> FETCH BILL</button>
        </div>
    </div>

    <div id="resultArea">
        <div id="welcomeMsg" style="text-align:center; padding:60px 20px;">
            <i class="fas fa-file-invoice" style="font-size:4rem; color:#1b5e3f; opacity:0.3; margin-bottom:20px;"></i>
            <h3 style="color:#1b5e3f;">Enter Reference Number</h3>
        </div>
        <div id="loading" style="display:none; text-align:center; padding:40px;"><i class="fas fa-circle-notch fa-spin fa-3x" style="color:#1b5e3f;"></i></div>
        <div id="billContent"></div>
    </div>
</div>

<script>
    function toggleMenu() {
        const menu = document.getElementById('menu');
        const overlay = document.getElementById('overlay');
        const isActive = menu.classList.toggle('active');
        overlay.style.display = isActive ? 'block' : 'none';
        setTimeout(() => overlay.style.opacity = isActive ? '1' : '0', 10);
    }

    const API_BASE = "https://ccms.pitc.com.pk/api/details/bill?reference=";
    const fetchBtn = document.getElementById('fetchBtn');
    const refInput = document.getElementById('refInput');
    const billContentDiv = document.getElementById('billContent');
    const welcomeMsg = document.getElementById('welcomeMsg');
    const loading = document.getElementById('loading');

    async function fetchBill() {
        const ref = refInput.value.trim().replace(/\s/g, '');
        if(ref.length < 10) { alert("Reference number theek se likhein!"); return; }

        loading.style.display = 'block';
        welcomeMsg.style.display = 'none';
        billContentDiv.innerHTML = '';

        try {
            const response = await fetch(API_BASE + ref);
            const data = await response.json();

            if(data.message === "Success" && data.bill) {
                const b = data.bill.basicInfo;
                billContentDiv.innerHTML = `
                    <div class="bill-card">
                        <div class="bill-header">
                            <div style="font-weight:bold; font-family:monospace; font-size:1.2rem;">REF: ${b.refNo}</div>
                            <div style="background:#ffc107; color:#000; padding:4px 12px; border-radius:20px; font-weight:bold; font-size:0.8rem;">${b.billMonth}</div>
                        </div>
                        <div class="bill-body">
                            <div class="info-grid">
                                <div class="info-item"><div class="info-label">Name</div><div class="info-value">${b.consumerName}</div></div>
                                <div class="info-item" style="background:#eef7e6; border-color:#2e7d32;"><div class="info-label">Amount Payable</div><div class="info-value" style="color:#2e7d32;">Rs. ${b.currAmntDue}</div></div>
                                <div class="info-item" style="background:#fff4e5; border-color:#e67e22;"><div class="info-label">Due Date</div><div class="info-value" style="color:#d35400;">${b.billDueDate}</div></div>
                                <div class="info-item"><div class="info-label">Address</div><div class="info-value">${b.consumerAddress1 || 'N/A'}</div></div>
                            </div>
                            <div class="red-code-badge">
                                یہ بل اصلی بل کی کاپی ہے۔ تصدیق کے لیے آفیشل ویب سائٹ چیک کریں۔<br>
                                Power By Awais Narowaliya
                            </div>
                        </div>
                    </div>`;
            } else {
                billContentDiv.innerHTML = `<p style="text-align:center; color:red; font-weight:bold;">Bill data nahi mila. Reference check karein.</p>`;
            }
        } catch (e) {
            billContentDiv.innerHTML = `<p style="text-align:center; color:red;">Server error! Baad mein koshish karein.</p>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    fetchBtn.addEventListener('click', fetchBill);
</script>

</body>
</html>
